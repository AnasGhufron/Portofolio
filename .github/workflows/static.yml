@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

/* ===== CSS VARIABLES ===== */
:root {
  --bg-primary: #080c14;
  --bg-secondary: #0d1421;
  --bg-card: #111827;
  --accent-cyan: #00f5d4;
  --accent-blue: #0ea5e9;
  --accent-purple: #8b5cf6;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #475569;
  --border: rgba(255, 255, 255, 0.06);
  --glow-cyan: 0 0 40px rgba(0, 245, 212, 0.15);
  --glow-blue: 0 0 40px rgba(14, 165, 233, 0.15);
}

/* ===== RESET & BASE ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  font-family: 'Syne', sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  cursor: none;
}

/* ===== CUSTOM CURSOR ===== */
.cursor {
  position: fixed;
  width: 12px;
  height: 12px;
  background: var(--accent-cyan);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.1s ease, background 0.3s ease;
}

.cursor-follower {
  position: fixed;
  width: 36px;
  height: 36px;
  border: 1.5px solid rgba(0, 245, 212, 0.5);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  transition: transform 0.2s ease, width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
}

body:hover .cursor { opacity: 1; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }

/* ===== NOISE OVERLAY ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9997;
  opacity: 0.4;
}

/* ===== GRID BACKGROUND ===== */
.grid-bg {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 245, 212, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 245, 212, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* ===== NAVIGATION ===== */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  backdrop-filter: blur(20px);
  background: rgba(8, 12, 20, 0.8);
  border-bottom: 1px solid var(--border);
  transition: all 0.3s ease;
}

.nav-logo {
  font-family: 'Space Mono', monospace;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--accent-cyan);
  text-decoration: none;
  letter-spacing: -1px;
}

.nav-logo span {
  color: var(--text-primary);
}

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}

.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: color 0.3s ease;
  position: relative;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--accent-cyan);
  transition: width 0.3s ease;
}

.nav-links a:hover {
  color: var(--accent-cyan);
}

.nav-links a:hover::after {
  width: 100%;
}

/* ===== HERO SECTION ===== */
#hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 120px 60px 60px;
  position: relative;
  overflow: hidden;
}

.hero-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 245, 212, 0.07) 0%, transparent 70%);
  top: -100px;
  right: -100px;
  pointer-events: none;
  animation: pulse 6s ease-in-out infinite;
}

.hero-glow-2 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.07) 0%, transparent 70%);
  bottom: 0;
  left: 100px;
  pointer-events: none;
  animation: pulse 8s ease-in-out infinite reverse;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.1); opacity: 1; }
}

.hero-content {
  max-width: 900px;
  position: relative;
  z-index: 1;
}

.hero-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent-cyan);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.2s forwards;
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-label::before {
  content: '';
  width: 40px;
  height: 1px;
  background: var(--accent-cyan);
}

.hero-name {
  font-size: clamp(3.5rem, 8vw, 7rem);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -3px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.4s forwards;
  margin-bottom: 8px;
}

.hero-name .highlight {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-name .line-2 {
  display: block;
  color: rgba(241, 245, 249, 0.15);
  -webkit-text-stroke: 1px rgba(241, 245, 249, 0.2);
}

.hero-tagline {
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: var(--text-secondary);
  margin: 28px 0 40px;
  font-weight: 400;
  max-width: 540px;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.6s forwards;
}

.hero-tagline span {
  color: var(--accent-cyan);
  font-weight: 600;
}

.hero-btns {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 0.8s ease 0.8s forwards;
}

.btn-primary {
  padding: 14px 36px;
  background: var(--accent-cyan);
  color: var(--bg-primary);
  border: none;
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}

.btn-primary:hover {
  background: var(--text-primary);
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(0, 245, 212, 0.3);
}

.btn-secondary {
  padding: 14px 36px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  font-family: 'Syne', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s ease;
}

.btn-secondary:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  transform: translateY(-2px);
}

.hero-scroll {
  position: absolute;
  bottom: 40px;
  left: 60px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  opacity: 0;
  animation: fadeUp 0.8s ease 1.2s forwards;
}

.scroll-line {
  width: 40px;
  height: 1px;
  background: var(--text-muted);
  animation: scrollAnim 2s ease-in-out infinite;
}

@keyframes scrollAnim {
  0%, 100% { width: 40px; opacity: 0.4; }
  50% { width: 60px; opacity: 1; }
}

/* ===== SECTION COMMON ===== */
section {
  padding: 100px 60px;
  position: relative;
  z-index: 1;
}

.section-header {
  margin-bottom: 64px;
}

.section-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent-cyan);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--accent-cyan);
}

.section-title {
  font-size: clamp(2rem, 4vw, 3.5rem);
  font-weight: 800;
  letter-spacing: -2px;
  line-height: 1;
}

/* ===== ABOUT SECTION ===== */
#about {
  background: var(--bg-secondary);
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 80px;
  align-items: center;
}

.about-visual {
  position: relative;
}

.about-img-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 4/5;
  background: var(--bg-card);
  border: 1px solid var(--border);
  overflow: hidden;
  clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
}

.about-avatar {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: linear-gradient(135deg, rgba(0, 245, 212, 0.05), rgba(139, 92, 246, 0.05));
}

.avatar-icon {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  font-weight: 800;
  color: var(--bg-primary);
  font-family: 'Space Mono', monospace;
}

.avatar-school {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent-cyan);
  letter-spacing: 2px;
  text-align: center;
  padding: 8px 20px;
  border: 1px solid rgba(0, 245, 212, 0.3);
  background: rgba(0, 245, 212, 0.05);
}

.about-badge {
  position: absolute;
  bottom: -20px;
  right: -20px;
  background: var(--accent-cyan);
  color: var(--bg-primary);
  padding: 16px 20px;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1px;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}

.about-corner {
  position: absolute;
  top: -10px;
  left: -10px;
  width: 40px;
  height: 40px;
  border-top: 2px solid var(--accent-cyan);
  border-left: 2px solid var(--accent-cyan);
}

.about-text h3 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: -1px;
}

.about-text h3 span {
  color: var(--accent-cyan);
}

.about-text p {
  color: var(--text-secondary);
  font-size: 1rem;
  margin-bottom: 16px;
  line-height: 1.8;
}

.about-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 32px;
}

.info-item {
  padding: 16px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.02);
}

.info-label {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.info-value {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
}

/* ===== SKILLS SECTION ===== */
#skills {
  background: var(--bg-primary);
}

.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.skill-card {
  padding: 32px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
  cursor: default;
}

.skill-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.skill-card:hover::before {
  transform: scaleX(1);
}

.skill-card:hover {
  border-color: rgba(0, 245, 212, 0.2);
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), var(--glow-cyan);
}

.skill-icon {
  font-size: 2rem;
  margin-bottom: 16px;
}

.skill-category {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--accent-cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.skill-card h3 {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag {
  padding: 4px 12px;
  background: rgba(0, 245, 212, 0.07);
  border: 1px solid rgba(0, 245, 212, 0.15);
  color: var(--text-secondary);
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 1px;
  transition: all 0.3s ease;
}

.tag:hover {
  background: rgba(0, 245, 212, 0.15);
  color: var(--accent-cyan);
}

/* ===== PROJECTS SECTION ===== */
#projects {
  background: var(--bg-secondary);
}

.projects-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 28px;
}

.project-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
  transition: all 0.4s ease;
  group: true;
}

.project-card:hover {
  border-color: rgba(0, 245, 212, 0.25);
  transform: translateY(-6px);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), var(--glow-cyan);
}

.project-img {
  height: 200px;
  background: linear-gradient(135deg, rgba(0, 245, 212, 0.08), rgba(139, 92, 246, 0.08));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.project-img::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 60%, rgba(0, 245, 212, 0.1));
}

.project-num {
  position: absolute;
  top: 16px;
  right: 16px;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 2px;
}

.project-body {
  padding: 28px;
}

.project-type {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--accent-cyan);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.project-body h3 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}

.project-body p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  line-height: 1.7;
  margin-bottom: 20px;
}

.project-stack {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
}

.stack-tag {
  padding: 3px 10px;
  background: rgba(139, 92, 246, 0.1);
  border: 1px solid rgba(139, 92, 246, 0.2);
  color: #a78bfa;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 1px;
}

.project-link {
  color: var(--accent-cyan);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 1px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: gap 0.3s ease;
}

.project-link:hover {
  gap: 10px;
}

/* ===== CONTACT SECTION ===== */
#contact {
  background: var(--bg-primary);
  text-align: center;
}

.contact-wrapper {
  max-width: 640px;
  margin: 0 auto;
}

.contact-wrapper p {
  color: var(--text-secondary);
  font-size: 1.1rem;
  line-height: 1.8;
  margin-bottom: 48px;
}

.contact-email {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: clamp(1rem, 2.5vw, 1.5rem);
  color: var(--accent-cyan);
  text-decoration: none;
  border-bottom: 1px solid rgba(0, 245, 212, 0.3);
  padding-bottom: 4px;
  margin-bottom: 48px;
  transition: all 0.3s ease;
  letter-spacing: -0.5px;
}

.contact-email:hover {
  border-color: var(--accent-cyan);
  text-shadow: 0 0 20px rgba(0, 245, 212, 0.5);
}

.social-links {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.social-link {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  text-decoration: none;
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 1px;
  transition: all 0.3s ease;
}

.social-link:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  background: rgba(0, 245, 212, 0.05);
  transform: translateY(-2px);
}

/* ===== FOOTER ===== */
footer {
  padding: 32px 60px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-secondary);
  position: relative;
  z-index: 1;
}

footer p {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 1px;
}

footer span {
  color: var(--accent-cyan);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.reveal {
  opacity: 0;
  transform: translateY(40px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }

/* ===== FLOATING ELEMENTS ===== */
.floating-code {
  position: absolute;
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: rgba(0, 245, 212, 0.12);
  letter-spacing: 1px;
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
}

/* ===== DIVIDER ===== */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
  opacity: 0.3;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  nav, #hero, section, footer {
    padding-left: 40px;
    padding-right: 40px;
  }

  .skills-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .hero-scroll {
    left: 40px;
  }
}

@media (max-width: 768px) {
  nav {
    padding: 16px 24px;
  }

  .nav-links {
    display: none;
  }

  #hero, section, footer {
    padding-left: 24px;
    padding-right: 24px;
  }

  .about-grid {
    grid-template-columns: 1fr;
    gap: 40px;
  }

  .skills-grid {
    grid-template-columns: 1fr;
  }

  .projects-grid {
    grid-template-columns: 1fr;
  }

  .about-info {
    grid-template-columns: 1fr;
  }

  footer {
    flex-direction: column;
    gap: 12px;
    text-align: center;
  }

  .hero-scroll {
    display: none;
  }
}

/* ===== STATUS INDICATOR ===== */
.status-dot {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 24px;
  opacity: 0;
  animation: fadeUp 0.8s ease 1s forwards;
}

.dot {
  width: 7px;
  height: 7px;
  background: #22c55e;
  border-radius: 50%;
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 6px #22c55e; }
  50% { opacity: 0.4; box-shadow: none; }
}
